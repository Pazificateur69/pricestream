apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-beat
  namespace: pricestream
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: celery-beat }
  template:
    metadata:
      labels: { app: celery-beat }
    spec:
      containers:
        - name: beat
          image: ghcr.io/pazificateur69/pricestream:latest
          args: ["celery-beat"]
          envFrom:
            - configMapRef: { name: pricestream-config }
            - secretRef: { name: pricestream-secret }
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits: { cpu: "200m", memory: "256Mi" }
