apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: pricestream
  labels: { app: web }
spec:
  replicas: 2
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
    spec:
      containers:
        - name: web
          image: ghcr.io/pazificateur69/pricestream:latest
          imagePullPolicy: IfNotPresent
          args: ["web"]
          envFrom:
            - configMapRef: { name: pricestream-config }
            - secretRef: { name: pricestream-secret }
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet: { path: /health/, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health/, port: 8000 }
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: pricestream
spec:
  type: ClusterIP
  selector: { app: web }
  ports:
    - name: http
      port: 80
      targetPort: 8000
